name: Update Behavior Diagrams

on:
  pull_request:
    branches:
      - main
    paths:
      - "custom_components/smart_venetian_blinds/**"
      - "script/visualize"
      - "requirements_visualize.txt"

permissions:
  contents: write

jobs:
  diagrams:
    name: "Regenerate behavior diagrams"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: ${{ github.head_ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install visualize dependencies
        run: pip install -r requirements_visualize.txt

      - name: Generate diagrams
        run: python3 script/visualize

      - name: Commit updated diagrams to PR branch
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          if git diff --cached --quiet; then
            echo "No diagram changes — nothing to commit."
          else
            git commit -m "chore: regenerate behavior diagrams" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:${{ github.head_ref }}
          fi
