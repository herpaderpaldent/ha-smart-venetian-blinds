name: Update Behavior Diagrams

# Run manually (e.g. before a release tag) to regenerate docs/images/ SVGs and
# open a PR with the result. Intentionally NOT triggered automatically on push
# to main — GitHub blocks CI on bot-created PRs (GITHUB_TOKEN), which means
# auto-created PRs can never satisfy required status checks and get stuck.
#
# Release process: run `script/visualize` locally, commit any SVG changes, then tag.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  diagrams:
    name: "Regenerate behavior diagrams"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install visualize dependencies
        run: pip install -r requirements_visualize.txt

      - name: Generate diagrams
        run: python3 script/visualize

      - name: Open PR with updated diagrams
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          if git diff --cached --quiet; then
            echo "No diagram changes — nothing to commit."
            exit 0
          fi
          BRANCH="chore/update-diagrams-${GITHUB_SHA::8}"
          git checkout -b "$BRANCH"
          git commit -m "chore: regenerate behavior diagrams"
          git push --force origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate behavior diagrams" \
            --body "Diagram update triggered manually via workflow_dispatch." \
            --label "chore" || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
