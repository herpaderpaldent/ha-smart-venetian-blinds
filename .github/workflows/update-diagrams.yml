name: Update Behavior Diagrams

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/smart_venetian_blinds/**"
      - "script/visualize"
      - "requirements_visualize.txt"

permissions:
  contents: write
  pull-requests: write

jobs:
  diagrams:
    name: "Regenerate behavior diagrams"
    runs-on: "ubuntu-latest"

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.13"

      - name: Install visualize dependencies
        run: pip install -r requirements_visualize.txt

      - name: Generate diagrams
        run: python3 script/visualize

      - name: Open PR with updated diagrams
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/images/
          if git diff --cached --quiet; then
            echo "No diagram changes — nothing to commit."
            exit 0
          fi
          BRANCH="chore/update-diagrams-${GITHUB_SHA::8}"
          git checkout -b "$BRANCH"
          git commit -m "chore: regenerate behavior diagrams"
          git push --force origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore: regenerate behavior diagrams" \
            --body "Automated diagram update after changes to \`main\`. Auto-merges when CI passes." \
            --label "chore" || true
          gh pr merge "$BRANCH" --squash --auto --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
