name: Tag and release

# Fires when the release-prepare PR is merged into main.
# Detects the version from manifest.json, creates the git tag,
# and publishes a GitHub Release with auto-generated release notes.
#
# Triggered automatically — no manual steps needed after merging the PR.

on:
  push:
    branches:
      - main
    paths:
      - "custom_components/smart_venetian_blinds/manifest.json"

permissions:
  contents: write

jobs:
  tag-and-release:
    name: "Create tag and GitHub Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Read version from manifest.json
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/smart_venetian_blinds/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected version: $VERSION"

      - name: Check tag does not already exist
        id: tag_check
        run: |
          if git rev-parse "refs/tags/${{ steps.version.outputs.version }}" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} already exists — skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag ${{ steps.version.outputs.version }} does not exist — will create."
          fi

      - name: Check commit is a release commit
        id: release_check
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if echo "$COMMIT_MSG" | grep -qE '^chore: release [0-9]+\.[0-9]+\.[0-9]+'; then
            echo "is_release=true" >> "$GITHUB_OUTPUT"
            echo "Commit is a release commit: $COMMIT_MSG"
          else
            echo "is_release=false" >> "$GITHUB_OUTPUT"
            echo "Not a release commit ($COMMIT_MSG) — skipping tag and release."
          fi

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false' && steps.release_check.outputs.is_release == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.version }}"
          git push origin "${{ steps.version.outputs.version }}"

      - name: Create GitHub Release
        if: steps.tag_check.outputs.exists == 'false' && steps.release_check.outputs.is_release == 'true'
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true
