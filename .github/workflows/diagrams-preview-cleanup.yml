name: Diagram preview cleanup

# Deletes the throwaway branch diagrams-preview.yml force-pushes for a PR.
#
# Deliberately has no paths filter: the preview branch may exist even when the
# closing PR's final diff no longer touches the paths that created it, and a
# missed cleanup leaves an orphan branch behind forever. Deleting a branch that
# was never created is a no-op, so running on every closed PR is the safe shape.
on:
  pull_request:
    types:
      - closed

permissions: {}

jobs:
  cleanup:
    name: "Delete preview branch"
    runs-on: "ubuntu-latest"
    if: github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: write

    steps:
      - name: Delete preview branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: diagrams-preview/pr-${{ github.event.number }}
        run: |
          set -euo pipefail
          if gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${BRANCH}" --silent 2>/dev/null; then
            echo "Deleted ${BRANCH}."
          else
            echo "No preview branch ${BRANCH} to delete."
          fi
