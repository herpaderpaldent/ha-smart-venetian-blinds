name: Release check

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  pull_request:
    branches:
      - main
    paths:
      - "custom_components/smart_venetian_blinds/manifest.json"

permissions: {}

jobs:
  version-match:
    name: Manifest version matches tag
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Read manifest version
        id: manifest
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('custom_components/smart_venetian_blinds/manifest.json'))['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version matches tag (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF_NAME}"
          MANIFEST_VERSION="${{ steps.manifest.outputs.version }}"
          if [[ "$TAG" != "$MANIFEST_VERSION" ]]; then
            echo "::error::Tag '$TAG' does not match manifest.json version '$MANIFEST_VERSION'."
            echo "::error::Do not tag by hand. Run Actions -> 'Prepare release' and merge the PR it opens;"
            echo "::error::the 'Tag and release' workflow then creates the tag from manifest.json."
            exit 1
          fi
          echo "Tag '$TAG' matches manifest.json version '$MANIFEST_VERSION'. ✓"
